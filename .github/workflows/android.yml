name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Runner ma preinstalowany Android SDK ($ANDROID_HOME); dokładamy tylko platformę 35.
      # (android-actions/setup-android@v3 próbuje instalować nieistniejący już pakiet "tools" i pada.)
      - name: Android SDK platform 35
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      # Model SFace (38 MB) pobiera Gradle; cache po sumie SHA-256 zapisanej w build.gradle.kts
      - name: Cache face model
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models/sface.onnx
          key: sface-${{ hashFiles('app/build.gradle.kts') }}

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build APK (arm64-v8a)
        run: ./gradlew assembleRelease -Pabis=arm64-v8a

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/kronikarz-poc-arm64-v8a-${GITHUB_SHA::7}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kronikarz-poc-arm64-v8a
          path: out/*.apk
          retention-days: 30

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
